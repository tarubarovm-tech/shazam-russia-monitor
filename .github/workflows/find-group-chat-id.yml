name: Find Telegram group chat id

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Find chat id from recent bot updates
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python scripts/find_group_chat_id.py
