name: Check Apple chart with Shazam fallback

on:
  # РАСПИСАНИЕ ОТКЛЮЧЕНО 22.09.2026: монитор переехал на собственный сервер
  # (Hetzner, Helsinki), где его запускает systemd-таймер каждые 10 минут.
  #
  # Если оставить крон включённым, мониторов станет два и они будут слать
  # дубли: состояние на сервере и в репозитории живёт отдельно, поэтому
  # один и тот же трек каждый счёл бы новым.
  #
  # Ручной запуск через workflow_dispatch сохранён — удобно для проверки,
  # что код в репозитории рабочий. Чтобы вернуть автозапуск на GitHub,
  # раскомментируйте блок schedule и остановите таймер на сервере:
  #   systemctl disable --now shazam-monitor.timer
  workflow_dispatch:
  # schedule:
  #   - cron: "1,11,21,31,41,51 * * * *"

permissions:
  contents: write

concurrency:
  group: apple-primary-chart-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Apple first, then Shazam fallback
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MUSICFETCH_TOKEN: ${{ secrets.MUSICFETCH_TOKEN }}
          # Прямая сверка с Яндексом. Без него monitor.py откатывается на
          # старую цепочку через song.link/Musicfetch.
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          # Ссылки на Spotify в алертах. Без ключей ссылка будет на Apple Music:
          # Songlink ссылки Spotify не отдаёт (у него запись о платформе есть,
          # но без url), поэтому спрашиваем Spotify напрямую.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python monitor.py
      - name: Save chart state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart_state.json
          git diff --cached --quiet || git commit -m "Update chart state"
          git push
