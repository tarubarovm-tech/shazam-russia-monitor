name: Send private Telegram test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Send private test
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          r = requests.post(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              data={
                  "chat_id": "710097553",
                  "text": "✅ Тест в личку. Теперь сообщения для тестов отправляем сюда.",
                  "disable_web_page_preview": "true",
              },
              timeout=30,
          )
          r.raise_for_status()
          PY
